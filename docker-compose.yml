services:
  vckb:
    build: .
    image: vckb:local
    # VCKB_TOKEN (and optionally VCKB_CORS_ORIGINS) come from .env
    env_file: .env
    environment:
      # Inside the container: listen on all interfaces and read boards from the volume.
      VCKB_HOST: 0.0.0.0
      VCKB_PORT: "8787"
      VCKB_BOARDS_DIR: /data
    ports:
      # Published on the host's loopback only. Do not change to 0.0.0.0 without a TLS proxy/VPN.
      - "127.0.0.1:${VCKB_PORT:-8787}:8787"
    volumes:
      # Host path of your boards (from .env or the shell); defaults to ./boards next to this file.
      - ${VCKB_BOARDS_DIR:-./boards}:/data
    restart: unless-stopped
